server {
    listen 80;
    listen [::]:80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /ror2-build-atlas/;
    }

    location = /ror2-build-atlas {
        return 301 /ror2-build-atlas/;
    }

    # Detail routes use URL hashes, so missing files should return 404.
    location /ror2-build-atlas/ {
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
